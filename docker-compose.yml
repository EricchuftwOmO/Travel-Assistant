# Starts every service: docker compose up --build / docker compose down
# The web app is at http://localhost:5173. It talks only to the gateway (http://localhost:8080);
# services reach each other by service name. Only the gateway and the web app publish ports; every other
# service is private to the Docker network. To open the services' Swagger UIs, add docker-compose.dev.yml (see that file).
# One PostgreSQL server (a database per service) and one Redis GET cache shared by four services.
# Set GROQ_API_KEY for real LLM answers and JWT_SECRET to sign login tokens (user service only) and GOOGLE_CLIENT_ID for Google sign-in, in .env.

services:
  gateway:
    build: ./backend/gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      USER_SERVICE_URL: http://user-service:3009
      TRIP_SERVICE_URL: http://trip-service:3001
      SEARCH_SERVICE_URL: http://activity-service:3007
      BUDGET_SERVICE_URL: http://budget-service:3003
      FLIGHT_SERVICE_URL: http://flight-service:3004
      HOTEL_SERVICE_URL: http://hotel-service:3005
      CAR_RENTAL_SERVICE_URL: http://car-rental-service:3006
      LLM_SERVICE_URL: http://llm-service:3008
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    restart: unless-stopped

  # The React app: http://localhost:5173 (it calls the gateway on port 8080)
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        # The map in Add place. Uses GOOGLE_MAPS_API_KEY, or the Places key if only that one is set.
        # Built into the app: run docker compose up --build frontend after changing it.
        VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-${GOOGLE_PLACES_API_KEY:-}}
        VITE_GOOGLE_MAP_ID: ${GOOGLE_MAP_ID:-}
        # The Sign in with Google button (the same client ID the user service checks). Empty = no button.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "5173:80"
    depends_on:
      - gateway
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  user-service:
    build: ./backend/user-service
    environment:
      PORT: 3009
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/user_db
      # Signs login tokens. Set a long random JWT_SECRET in .env; the default is for local development only.
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      # OAuth web client ID for Sign in with Google (public, not a secret). Empty = Google sign-in off.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Deleting an account first deletes the user's trips there
      TRIP_SERVICE_URL: http://trip-service:3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3009/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  trip-service:
    build: ./backend/trip-service
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/trip_db
      # Attaching a flight to a trip copies its details from the flight service
      FLIGHT_SERVICE_URL: http://flight-service:3004
      # Google Places API (New): nearby places for the Add place map. Empty = sample places only.
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  flight-service:
    build: ./backend/flight-service
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379
      # Live Google Flights results (searches with origin, destination and a future date). Empty = catalog only.
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  hotel-service:
    build: ./backend/hotel-service
    environment:
      PORT: 3005
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  car-rental-service:
    build: ./backend/car-rental-service
    environment:
      PORT: 3006
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  activity-service:
    build: ./backend/activity-service
    environment:
      PORT: 3007
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3007/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  llm-service:
    build: ./backend/llm-service
    environment:
      PORT: 3008
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      # the LLM service calls these services directly (internal network) to build recommendations
      FLIGHT_SERVICE_URL: http://flight-service:3004
      HOTEL_SERVICE_URL: http://hotel-service:3005
      ACTIVITY_SERVICE_URL: http://activity-service:3007
      CAR_RENTAL_SERVICE_URL: http://car-rental-service:3006
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3008/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
