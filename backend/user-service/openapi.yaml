openapi: 3.0.3
info:
  title: Travel Assistant - User Service
  version: 2.0.0
  description: |
    Accounts, login (password or Google) and the My Profile page. This is a plain **REST** service;
    the web app reaches it through the gateway's GraphQL API, which calls these endpoints.

    Login tokens are JWTs (HS256, 1 hour) signed with `JWT_SECRET`, which only this service knows.
    Send them as `Authorization: Bearer <token>`. For every other protected route the gateway asks
    `GET /api/auth/validate` whether the token is good.

    **Sign in with Google:** the browser gets an ID token from Google Sign-In and sends it to
    `POST /api/auth/google`. It is verified against `GOOGLE_CLIENT_ID`; the account is created on first
    use (or linked to an existing account with the same email), and the response is the same as a
    password login.

    My Profile (three tabs): `PATCH` bodies change only the fields sent; `null` clears an optional field.
servers:
  - url: http://localhost:8080
    description: Through the API gateway
  - url: http://localhost:3009
    description: The user service directly (development)
tags:
  - name: Auth
  - name: Users
  - name: Health
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created; returns the user and a token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthPayload' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: Accounts that only use Google have no password and always get 401 here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: alice@example.com }
                password: { type: string, example: Password123! }
      responses:
        '200':
          description: The user and a token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthPayload' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/google:
    post:
      tags: [Auth]
      summary: Sign in with Google
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                  description: The Google ID token (a JWT) from Google Sign-In
      responses:
        '200':
          description: Google token accepted; the user and our own token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthPayload' }
        '400': { $ref: '#/components/responses/Error' }
        '401':
          description: The Google token is invalid, expired, or has an unverified email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: The email belongs to an account linked to a different Google identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: GOOGLE_CLIENT_ID is not set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/auth/validate:
    get:
      tags: [Auth]
      summary: Check a bearer token (used by the gateway)
      description: 200 when the token verifies and the account still exists. Does no profile lookups.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: integer, example: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users/me:
    get:
      tags: [Users]
      summary: My profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The signed-in user, with language settings and travel preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Users]
      summary: Replace my name and email (simple update)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, maxLength: 100, example: Alice Chen }
                email: { type: string, format: email }
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Users]
      summary: Delete my account
      description: Asks the trip service to delete my trips first (`DELETE /internal/my-data` with `X-User-Id`), then deletes the account. If the trip service cannot, the account is kept (502).
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/Error' }
  /api/users/me/basic-info:
    patch:
      tags: [Users]
      summary: Save the Basic Information tab
      description: Email changes need a separate verification step and are not accepted here.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BasicInfoRequest' }
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users/me/language-settings:
    get:
      tags: [Users]
      summary: My language and time zone
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Language settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LanguageSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      summary: Save the Language & Timezone tab
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language: { type: string, example: zh-TW }
                timezone: { type: string, example: Asia/Taipei }
      responses:
        '200':
          description: The saved settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LanguageSettings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users/me/travel-preferences:
    get:
      tags: [Users]
      summary: My travel preferences
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Travel preferences (empty defaults if never saved)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelPreferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      summary: Save the Travel Preferences tab
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TravelPreferences' }
      responses:
        '200':
          description: The saved preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TravelPreferences' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /health:
    get:
      tags: [Health]
      summary: Service and database health
      responses:
        '200': { description: Up }
        '503': { description: Database unavailable }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, invalid or expired token (or the account no longer exists)
      headers:
        WWW-Authenticate: { schema: { type: string, example: Bearer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: BAD_REQUEST }
            message: { type: string }
            details: { type: array, items: { type: string } }
    RegisterRequest:
      type: object
      required: [email, password]
      description: Give either `name` (split into first and last name) or `firstName` and `lastName`.
      properties:
        name: { type: string, maxLength: 100, example: Dana Lee }
        firstName: { type: string, maxLength: 50 }
        lastName: { type: string, maxLength: 50 }
        email: { type: string, format: email, example: dana@example.com }
        password: { type: string, minLength: 8, example: Password123! }
    LanguageSettings:
      type: object
      properties:
        language: { type: string, example: en }
        timezone: { type: string, example: America/Los_Angeles }
    TravelPreferences:
      type: object
      properties:
        budgetLevel: { type: string, nullable: true, enum: [BUDGET, MODERATE, LUXURY] }
        travelStyles:
          type: array
          items: { type: string, enum: [ADVENTURE, NATURE, CULTURE, FOOD, RELAXATION] }
    BasicInfoRequest:
      type: object
      properties:
        firstName: { type: string, maxLength: 50 }
        lastName: { type: string, maxLength: 50 }
        gender: { type: string, nullable: true, enum: [MALE, FEMALE, NON_BINARY, OTHER, PREFER_NOT_TO_SAY] }
        dateOfBirth: { type: string, format: date, nullable: true, example: '2000-05-10' }
        phone: { type: string, nullable: true, example: '+1 (253) 555-0198' }
        country: { type: string, nullable: true, example: United States }
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        firstName: { type: string, example: Alice }
        lastName: { type: string, example: Chen }
        name: { type: string, example: Alice Chen }
        email: { type: string, example: alice@example.com }
        gender: { type: string, nullable: true }
        dateOfBirth: { type: string, nullable: true, example: '2000-05-10' }
        phone: { type: string, nullable: true }
        country: { type: string, nullable: true }
        language: { type: string, example: en }
        timezone: { type: string, example: America/Los_Angeles }
        createdAt: { type: string, format: date-time }
        languageSettings: { $ref: '#/components/schemas/LanguageSettings' }
        travelPreferences: { $ref: '#/components/schemas/TravelPreferences' }
    AuthPayload:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
