openapi: 3.1.0
info:
  title: Travel Assistant - Hotel Service
  version: 1.0.0
  description: 'Hotels a traveler can pick for a trip. Cached in Redis for GET requests. Errors use { "error": {
    "code", "message", "details" } }.'
servers:
  - url: http://localhost:3005
    description: hotel-service (published on localhost for development; other clients go through the gateway on port 8080)
tags:
  - name: Hotels
  - name: Health
paths:
  /health:
    get:
      tags:
        - Health
      summary: Service and database health check
      operationId: getHotelServiceHealth
      responses:
        "200":
          description: Service and database are up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: hotel-service
                  cache:
                    type: string
                    enum:
                      - redis
                      - off
        "503":
          description: Database unavailable
  /api/hotels:
    get:
      tags:
        - Hotels
      summary: List hotels
      operationId: listHotels
      description: "All filters are optional and can be combined. Responses are cached in Redis (see the X-Cache
        header: HIT or MISS)."
      parameters:
        - name: city
          in: query
          description: City name (equals (ignore case))
          schema:
            type: string
        - name: country
          in: query
          description: Country name (equals (ignore case))
          schema:
            type: string
        - name: minStars
          in: query
          description: Fewest stars (>=)
          schema:
            type: integer
        - name: maxPrice
          in: query
          description: Highest price per night (<=)
          schema:
            type: number
        - name: available
          in: query
          description: Only available (true) or unavailable (false) hotels (equals)
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - id
              - price_per_night
              - stars
              - rating
            default: id
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Rows to skip
      responses:
        "200":
          description: A page of hotels
          headers:
            X-Total-Count:
              description: Rows matching the filters
              schema:
                type: integer
            X-Cache:
              description: HIT if served from Redis
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                  - total
                  - data
                properties:
                  count:
                    type: integer
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Hotel"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags:
        - Hotels
      summary: Create a hotel
      operationId: createHotel
      description: Send every required field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelInput"
      responses:
        "201":
          description: Hotel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
          headers:
            Location:
              description: URL of the new record
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/hotels/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Hotel ID
    get:
      tags:
        - Hotels
      summary: Get one hotel
      operationId: getHotel
      responses:
        "200":
          description: The hotel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Hotels
      summary: Replace a hotel
      operationId: replaceHotel
      description: Send every required field. Optional fields left out go back to their default (or null).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelInput"
      responses:
        "200":
          description: The updated hotel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Hotels
      summary: Update some fields of a hotel
      operationId: updateHotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelPatch"
      responses:
        "200":
          description: The updated hotel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Hotels
      summary: Delete a hotel
      operationId: deleteHotel
      responses:
        "204":
          description: Deleted, no content
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    Hotel:
      type: object
      required:
        - id
        - name
        - city
        - country
        - stars
        - price_per_night
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Hotel Gracery Shinjuku
        city:
          type: string
          example: Tokyo
        country:
          type: string
          example: Japan
        address:
          type:
            - string
            - "null"
          example: 1-19-1 Kabukicho, Shinjuku
        stars:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        price_per_night:
          type: number
          minimum: 0
          example: 165
        currency:
          type:
            - string
            - "null"
          maxLength: 3
          default: USD
          example: USD
        rating:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 10
          description: Guest rating, 0 to 10
          example: 8.6
        available:
          type:
            - boolean
            - "null"
          default: true
          example: true
        created_at:
          type: string
          format: date-time
    HotelInput:
      type: object
      additionalProperties: false
      required:
        - name
        - city
        - country
        - stars
        - price_per_night
      properties:
        name:
          type: string
          example: Hotel Gracery Shinjuku
        city:
          type: string
          example: Tokyo
        country:
          type: string
          example: Japan
        address:
          type: string
          example: 1-19-1 Kabukicho, Shinjuku
        stars:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        price_per_night:
          type: number
          minimum: 0
          example: 165
        currency:
          type: string
          maxLength: 3
          default: USD
          example: USD
        rating:
          type: number
          minimum: 0
          maximum: 10
          description: Guest rating, 0 to 10
          example: 8.6
        available:
          type: boolean
          default: true
          example: true
    HotelPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Any subset of the fields
      properties:
        name:
          type: string
          example: Hotel Gracery Shinjuku
        city:
          type: string
          example: Tokyo
        country:
          type: string
          example: Japan
        address:
          type: string
          example: 1-19-1 Kabukicho, Shinjuku
        stars:
          type: integer
          minimum: 1
          maximum: 5
          example: 4
        price_per_night:
          type: number
          minimum: 0
          example: 165
        currency:
          type: string
          maxLength: 3
          default: USD
          example: USD
        rating:
          type: number
          minimum: 0
          maximum: 10
          description: Guest rating, 0 to 10
          example: 8.6
        available:
          type: boolean
          default: true
          example: true
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
            details: {}
  responses:
    BadRequest:
      description: Invalid or missing field or query parameter (BAD_REQUEST). "details" lists every invalid field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: BAD_REQUEST
              message: Validation failed
              details:
                - field: name
                  message: is required
    NotFound:
      description: Hotel not found (NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: The language model failed (LLM_UNAVAILABLE)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
