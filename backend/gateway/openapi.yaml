        - email
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
    TripRequest:
      type: object
      required:
        - title
        - destination
        - startDate
        - endDate
      properties:
        title:
          type: string
          maxLength: 120
        destination:
          type: string
          maxLength: 120
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Must be on or after startDate
    User:
      type: object
      required:
