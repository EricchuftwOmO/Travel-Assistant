openapi: 3.1.0
info:
  title: Travel Assistant API
  version: 0.2.0
  description: Single entry point for the Travel Assistant frontend. The API gateway forwards every /api/*
    request to the service that owns it (Trip, Activity, Budget, Flight, Hotel, Car Rental, LLM advice) and
    adds CORS, X-Request-Id tracing, timeouts and uniform errors. Only the endpoints implemented so far are
    listed here. Each service also publishes its own spec and Swagger UI at /docs on its development port
    (3004 flights, 3005 hotels, 3006 car rentals, 3007 activities, 3008 advice).
servers:
  - url: http://localhost:8080
    description: API gateway (Docker Compose and default local port)
paths:
  /health:
    get:
      summary: Gateway liveness check
      operationId: getGatewayHealth
      responses:
        "200":
          description: The gateway is running
      tags:
        - Health
  /api/health:
    get:
      summary: Combined health of every configured service
      operationId: getServicesHealth
      responses:
        "200":
          description: Every configured service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: ok
                services:
                  trip:
                    status: up
                    httpStatus: 200
                    latencyMs: 4
                  budget:
                    status: up
                    httpStatus: 200
                    latencyMs: 3
        "503":
          description: At least one service is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: degraded
                services:
                  trip:
                    status: up
                    httpStatus: 200
                    latencyMs: 4
                  search:
                    status: down
                    reason: unreachable
                    latencyMs: 1
      tags:
        - Health
  /api/trips:
    get:
      summary: List one user's trips, ordered by start date
      operationId: listTrips
      parameters:
        - name: userId
          in: query
          required: true
          description: ID of the user whose trips to return
          schema:
            type: string
          example: u1
      responses:
        "200":
          description: The user's trips (empty array if none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"
              example:
                - id: 1
                  user_id: u1
                  title: Tokyo Trip
                  start_date: 2026-12-01
                  end_date: 2026-12-05
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      tags:
        - Trips
  /api/flights:
    get:
      tags:
        - Flights
      summary: List flights
      operationId: listFlights
      description: "All filters are optional and can be combined. Responses are cached in Redis (see the X-Cache
        header: HIT or MISS)."
      parameters:
        - name: origin
          in: query
          description: Origin airport code (equals (ignore case))
          schema:
            type: string
        - name: destination
          in: query
          description: Destination airport code (equals (ignore case))
          schema:
            type: string
        - name: departDate
          in: query
          description: Departure date (YYYY-MM-DD) (on date)
          schema:
            type: string
            format: date
        - name: maxPrice
          in: query
          description: Highest price (<=)
          schema:
            type: number
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - id
              - price
              - depart_at
              - arrive_at
            default: id
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Rows to skip
      responses:
        "200":
          description: A page of flights
          headers:
            X-Total-Count:
              description: Rows matching the filters
              schema:
                type: integer
            X-Cache:
              description: HIT if served from Redis
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                  - total
                  - data
                properties:
                  count:
                    type: integer
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Flight"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
    post:
      tags:
        - Flights
      summary: Create a flight
      operationId: createFlight
      description: Send every required field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlightInput"
      responses:
        "201":
          description: Flight created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flight"
          headers:
            Location:
              description: URL of the new record
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /api/flights/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Flight ID
    get:
      tags:
        - Flights
      summary: Get one flight
      operationId: getFlight
      responses:
        "200":
          description: The flight
          content:
            application/json:
              schema:
