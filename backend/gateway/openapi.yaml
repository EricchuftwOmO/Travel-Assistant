openapi: 3.1.0
info:
  title: Travel Assistant API
  version: 0.2.0
  description: Single entry point for the Travel Assistant frontend. The API gateway forwards every /api/*
    request to the service that owns it (Trip, Activity, Budget, Flight, Hotel, Car Rental, LLM advice) and
    checks the login token (bearer JWT) on every route except sign-up, login and reading flights, hotels,
    car rentals and activities, and adds CORS, X-Request-Id tracing, timeouts and uniform errors. Only the endpoints implemented so far are
    listed here. Each service also publishes its own spec and Swagger UI at /docs on its development port
    (3001 trips and accounts, 3004 flights, 3005 hotels, 3006 car rentals, 3007 activities, 3008 advice).
servers:
  - url: http://localhost:8080
    description: API gateway (Docker Compose and default local port)
paths:
  /health:
    get:
      summary: Gateway liveness check
      operationId: getGatewayHealth
      responses:
        "200":
          description: The gateway is running
      tags:
        - Health
  /api/health:
    get:
      summary: Combined health of every configured service
      operationId: getServicesHealth
      responses:
        "200":
          description: Every configured service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: ok
                services:
                  trip:
                    status: up
                    httpStatus: 200
                    latencyMs: 4
                  budget:
                    status: up
                    httpStatus: 200
                    latencyMs: 3
        "503":
          description: At least one service is down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: degraded
                services:
                  trip:
                    status: up
                    httpStatus: 200
                    latencyMs: 4
                  search:
                    status: down
                    reason: unreachable
                    latencyMs: 1
      tags:
        - Health
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: Frank Lee
              email: frank@example.com
              password: Password123!
      responses:
        "201":
          description: Account created. The response includes a token, so no separate login is needed.
          headers:
            Location:
              description: URL of the new account
              schema:
                type: string
              example: /api/users/me
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                user:
                  id: 6
                  name: Frank Lee
                  email: frank@example.com
                  createdAt: 2026-11-06T18:30:00.000Z
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjZ9.signature
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/EmailConflict"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security: []
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Log in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: alice@example.com
              password: Password123!
      responses:
        "200":
          description: Credentials accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                user:
                  id: 1
                  name: Alice Chen
                  email: alice@example.com
                  createdAt: 2026-11-06T18:00:00.000Z
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjF9.signature
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: The email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: UNAUTHORIZED
                  message: Email or password is incorrect
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security: []
  /api/users/me:
    get:
      tags:
        - Users
      summary: Get my account
      operationId: getMe
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 1
                name: Alice Chen
                email: alice@example.com
                createdAt: 2026-11-06T18:00:00.000Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
    put:
      tags:
        - Users
      summary: Update my account
      description: Replaces the name and email. The password cannot be changed through this endpoint.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
            example:
              name: Alice Chen-Wu
              email: alice@example.com
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 1
                name: Alice Chen-Wu
                email: alice@example.com
                createdAt: 2026-11-06T18:00:00.000Z
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/EmailConflict"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
    delete:
      tags:
        - Users
      summary: Delete my account
      description: Permanently deletes the account and all of its trips. Existing tokens stop working immediately.
      operationId: deleteMe
      responses:
        "204":
          description: Account and trips deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
  /api/trips:
    post:
      tags:
        - Trips
      summary: Create a trip
      description: |
        The owner is always the signed-in user. An `ownerId` in the body is ignored.
        One empty itinerary day is created for every date of the trip, and a
        trip can last at most 90 days.
      operationId: createTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripRequest"
            example:
              title: Rome Getaway
              destination: Rome
              startDate: 2027-09-01
              endDate: 2027-09-05
      responses:
        "201":
          description: Trip created
          headers:
            Location:
              description: URL of the new trip
              schema:
                type: string
              example: /api/trips/16
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
              example:
                id: 16
                ownerId: 1
                title: Rome Getaway
                destination: Rome
                startDate: 2027-09-01
                endDate: 2027-09-05
                createdAt: 2026-11-06T18:30:00.000Z
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
    get:
      tags:
        - Trips
      summary: List my trips
      description: |
        Returns the signed-in user's trips, ordered by start date. `search` and
        `status` are optional and can be combined.
      operationId: listTrips
      parameters:
        - name: search
          in: query
          description: Keep trips whose title contains this text, ignoring case. A blank value is ignored.
          schema:
            type: string
            maxLength: 120
          example: japan
        - name: status
          in: query
          description: "`upcoming` keeps trips that have not ended yet, including trips in progress. `past` keeps trips that have ended. Dates are compared using the database server's current date."
          schema:
            type: string
            enum:
              - upcoming
              - past
      responses:
        "200":
          description: The matching trips. The list is empty when nothing matches.
          headers:
            X-Total-Count:
              description: Number of trips returned
              schema:
                type: integer
              example: 2
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"
              example:
                - id: 5
                  ownerId: 1
                  title: Japan Spring Getaway
                  destination: Osaka
                  startDate: 2026-04-02
                  endDate: 2026-04-09
                  createdAt: 2026-11-06T18:00:00.000Z
                - id: 1
                  ownerId: 1
                  title: Japan Trip
                  destination: Tokyo
                  startDate: 2027-01-28
                  endDate: 2027-02-03
                  createdAt: 2026-11-06T18:00:00.000Z
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
  /api/trips/{tripId}:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      tags:
        - Trips
      summary: Get one of my trips
      operationId: getTrip
      responses:
        "200":
          description: The requested trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
              example:
                id: 1
                ownerId: 1
                title: Japan Trip
                destination: Tokyo
                startDate: 2027-01-28
                endDate: 2027-02-03
                createdAt: 2026-11-06T18:00:00.000Z
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TripNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
    put:
      tags:
        - Trips
      summary: Update one of my trips
      description: |
        Replaces the trip's editable fields, so all of them are required.
  
        The itinerary days follow the new dates: every day is re-dated from the
        new start date, extra days are added when the trip gets longer, and
        trailing days are removed when it gets shorter. A day that still has
        places is never removed; the request fails with `409` instead, and
        nothing changes.
      operationId: updateTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripRequest"
            example:
              title: Japan Winter Trip
              destination: Tokyo
              startDate: 2027-01-28
              endDate: 2027-02-05
      responses:
        "200":
          description: Trip updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
              example:
                id: 1
                ownerId: 1
                title: Japan Winter Trip
                destination: Tokyo
                startDate: 2027-01-28
                endDate: 2027-02-05
                createdAt: 2026-11-06T18:00:00.000Z
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TripNotFound"
        "409":
          $ref: "#/components/responses/DaysInUse"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
    delete:
      tags:
        - Trips
      summary: Delete one of my trips
      operationId: deleteTrip
      responses:
        "204":
          description: Trip deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TripNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
  /api/trips/{tripId}/itineraries:
    parameters:
      - $ref: "#/components/parameters/TripId"
    get:
      tags:
        - Itineraries
      summary: List the days of one of my trips
      operationId: listDays
      responses:
        "200":
          description: Every day of the trip in order, with how many places each one has
          headers:
            X-Total-Count:
              description: Number of days returned
              schema:
                type: integer
              example: 7
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DaySummary"
              example:
                - id: 1
                  tripId: 1
                  dayNumber: 1
                  date: 2027-01-28
                  placeCount: 2
                - id: 2
                  tripId: 1
                  dayNumber: 2
                  date: 2027-01-29
                  placeCount: 3
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TripNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
  /api/trips/{tripId}/itineraries/{dayNumber}:
    parameters:
      - $ref: "#/components/parameters/TripId"
      - $ref: "#/components/parameters/DayNumber"
    get:
      tags:
        - Itineraries
      summary: Get one day's itinerary
      operationId: getDay
      responses:
        "200":
          description: The day with its places in visiting order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Day"
              example:
                id: 1
                tripId: 1
                dayNumber: 1
                date: 2027-01-28
                items:
                  - id: 1
                    position: 1
                    place:
                      id: 1
                      googlePlaceId: null
                      name: Senso-ji Temple
                      city: Tokyo
                      category: attraction
                  - id: 2
                    position: 2
                    place:
                      id: 2
                      googlePlaceId: null
                      name: Tokyo Skytree
                      city: Tokyo
                      category: attraction
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DayNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
  /api/trips/{tripId}/itineraries/{dayNumber}/items:
    parameters:
      - $ref: "#/components/parameters/TripId"
      - $ref: "#/components/parameters/DayNumber"
    post:
      tags:
        - Itineraries
      summary: Add a place to a day
      description: |
        Inserts the place at `position`. The place already at that position,
        and every place after it, moves down by one. Leave out `position` to add
        the place at the end of the day. The same place may appear more than once.
      operationId: addItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItemRequest"
            example:
              placeId: 5
              position: 2
      responses:
        "201":
          description: Place added
          headers:
            Location:
              description: URL of the new itinerary item
              schema:
                type: string
              example: /api/trips/1/itineraries/1/items/15
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItem"
              example:
                id: 15
                position: 2
                place:
                  id: 5
                  googlePlaceId: null
                  name: Tsukiji Outer Market
                  city: Tokyo
                  category: food
        "400":
          description: The body is invalid, `placeId` does not match a place, or `position` is past the end of the day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: BAD_REQUEST
                  message: Request validation failed
                  details:
                    - position must be between 1 and 3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DayNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
    delete:
      tags:
        - Itineraries
      summary: Remove every place from a day
      description: Empties the day. The day itself remains, because the trip's dates define its days.
      operationId: clearItems
      responses:
        "204":
          description: The day is now empty
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DayNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
  /api/trips/{tripId}/itineraries/{dayNumber}/items/order:
    parameters:
      - $ref: "#/components/parameters/TripId"
      - $ref: "#/components/parameters/DayNumber"
    put:
      tags:
        - Itineraries
      summary: Reorder a day's places
      description: |
        `itemIds` lists every item of the day exactly once, in the new visiting
        order. The first ID gets position 1.
      operationId: reorderItems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemOrderRequest"
            example:
              itemIds:
                - 2
                - 1
      responses:
        "200":
          description: The day in its new order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Day"
              example:
                id: 1
                tripId: 1
                dayNumber: 1
                date: 2027-01-28
                items:
                  - id: 2
                    position: 1
                    place:
                      id: 2
                      googlePlaceId: null
                      name: Tokyo Skytree
                      city: Tokyo
                      category: attraction
                  - id: 1
                    position: 2
                    place:
                      id: 1
                      googlePlaceId: null
                      name: Senso-ji Temple
                      city: Tokyo
                      category: attraction
        "400":
          description: The body is invalid, or `itemIds` does not list exactly the day's items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: BAD_REQUEST
                  message: Request validation failed
                  details:
                    - itemIds must list every item of this day exactly once
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/DayNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
  /api/trips/{tripId}/itineraries/{dayNumber}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/TripId"
      - $ref: "#/components/parameters/DayNumber"
      - $ref: "#/components/parameters/ItemId"
    get:
      tags:
        - Itineraries
      summary: Get one itinerary item
      operationId: getItem
      responses:
        "200":
          description: The requested item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryItem"
              example:
                id: 1
                position: 1
                place:
                  id: 1
                  googlePlaceId: null
                  name: Senso-ji Temple
                  city: Tokyo
                  category: attraction
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ItemNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
    delete:
      tags:
        - Itineraries
      summary: Remove a place from a day
      description: Every place after the removed one moves up by one, so positions stay 1, 2, 3, and so on.
      operationId: removeItem
      responses:
        "204":
          description: Place removed
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ItemNotFound"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
  /api/places:
    get:
      tags:
        - Places
      summary: List places
      description: |
        Returns the places that can be added to an itinerary, ordered by city and
        name. These are sample places stored in the database; `googlePlaceId` is
        reserved for a future Google Places integration.
      operationId: listPlaces
      parameters:
        - name: city
          in: query
          description: Keep places in this city. The whole name must match, ignoring case.
          schema:
            type: string
            maxLength: 120
          example: tokyo
        - name: category
          in: query
          description: Keep places in this category. The whole name must match, ignoring case.
          schema:
            type: string
            maxLength: 120
          example: food
      responses:
        "200":
          description: The matching places. The list is empty when nothing matches.
          headers:
            X-Total-Count:
              description: Number of places returned
              schema:
                type: integer
              example: 1
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Place"
              example:
                - id: 5
                  googlePlaceId: null
                  name: Tsukiji Outer Market
                  city: Tokyo
                  category: food
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
      security:
        - bearerAuth: []
  /api/flights:
    get:
      tags:
        - Flights
      summary: List flights
      operationId: listFlights
      description: "All filters are optional and can be combined. Responses are cached in Redis (see the X-Cache
        header: HIT or MISS). Planned: live results from SerpApi (Google Flights); today the Flight service
        reads its stored flights."
      parameters:
        - name: origin
          in: query
          description: Origin airport code (equals (ignore case))
          schema:
            type: string
        - name: destination
          in: query
          description: Destination airport code (equals (ignore case))
          schema:
            type: string
        - name: departDate
          in: query
          description: Departure date (YYYY-MM-DD) (on date)
          schema:
            type: string
            format: date
        - name: maxPrice
          in: query
