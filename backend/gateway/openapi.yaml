        LLM_UNAVAILABLE. The gateway allows 40 s for this call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdviceInput"
      responses:
        "201":
          description: Advice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advice"
          headers:
            Location:
              description: URL of the new record
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /api/advice/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Advice ID
    get:
      security:
        - bearerAuth: []
      tags:
        - Advice
      summary: Get one advice
      operationId: getAdvice
      responses:
        "200":
          description: The advice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
    put:
      security:
        - bearerAuth: []
      tags:
        - Advice
      summary: Replace a advice
      operationId: replaceAdvice
      description: Send every required field. Optional fields left out go back to their default (or null).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdviceInput"
      responses:
        "200":
          description: The updated advice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
    patch:
      security:
        - bearerAuth: []
      tags:
        - Advice
      summary: Update some fields of a advice
      operationId: updateAdvice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvicePatch"
      responses:
        "200":
          description: The updated advice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
    delete:
      security:
        - bearerAuth: []
      tags:
        - Advice
      summary: Delete a advice
      operationId: deleteAdvice
      responses:
        "204":
          description: Deleted, no content
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /api/advice/recommendations:
    post:
      security:
        - bearerAuth: []
      tags:
        - Advice
      summary: Create a recommendation summary
      operationId: createRecommendation
      description: The LLM service calls the Flight, Hotel and Activity services (and the Car Rental service when
        include_car is true) directly, lets the language model choose among the results (or picks with plain
        rules when no GROQ_API_KEY is set or the model's choice is unusable), adds up the cost in code, checks
        it against the budget, and saves the summary as advice. Nothing is saved if a service or the model
        fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationRequest"
      responses:
        "201":
          description: Recommendation saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No flights, hotels or activities found for the destination (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: LLM_UNAVAILABLE (the model failed) or SERVICE_UNAVAILABLE (a search service is down). Nothing is
            saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/trips/{tripId}/settlements:
    get:
      tags:
        - Planned
      summary: Who owes whom for a trip (planned)
      operationId: getSettlements
      description: PLANNED (Phase III, not implemented yet). For each currency, work out every member's balance (paid
        minus owed) and the smallest set of payments that settles everyone.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Balances and transfers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementReport"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
          description: Stored in lowercase
        password:
          type: string
          format: password
          minLength: 8
          description: At least 8 characters and at most 72 bytes
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ProfileRequest:
      type: object
      required:
