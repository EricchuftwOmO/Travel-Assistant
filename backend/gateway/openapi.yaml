          $ref: "#/components/responses/UpstreamTimeout"
  /api/advice:
    get:
      tags:
        - Advice
      summary: List advices
      operationId: listAdvices
      description: "All filters are optional and can be combined. Responses are cached in Redis (see the X-Cache
        header: HIT or MISS)."
      parameters:
        - name: userId
          in: query
          description: User's ID (equals)
          schema:
            type: string
        - name: tripId
          in: query
          description: Trip ID (equals)
          schema:
            type: integer
        - name: topic
          in: query
          description: Advice topic (equals)
          schema:
            type: string
            enum:
              - general
              - packing
              - food
              - safety
              - budget
              - itinerary
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - id
              - created_at
            default: id
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Rows to skip
      responses:
        "200":
          description: A page of advices
          headers:
            X-Total-Count:
              description: Rows matching the filters
              schema:
                type: integer
            X-Cache:
              description: HIT if served from Redis
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                  - total
                  - data
                properties:
                  count:
                    type: integer
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Advice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
    post:
      tags:
        - Advice
      summary: Create a advice
      operationId: createAdvice
      description: Send every required field. If "content" is left out, the language model writes it from "prompt"
        (source "llm"); with no API key a placeholder is stored (source "stub"). A model failure returns 502
        LLM_UNAVAILABLE. The gateway allows 40 s for this call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdviceInput"
      responses:
        "201":
          description: Advice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advice"
          headers:
            Location:
              description: URL of the new record
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /api/advice/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Advice ID
    get:
      tags:
        - Advice
      summary: Get one advice
      operationId: getAdvice
      responses:
        "200":
          description: The advice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
    put:
      tags:
        - Advice
      summary: Replace a advice
      operationId: replaceAdvice
      description: Send every required field. Optional fields left out go back to their default (or null).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdviceInput"
      responses:
        "200":
          description: The updated advice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
    patch:
      tags:
        - Advice
      summary: Update some fields of a advice
      operationId: updateAdvice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvicePatch"
      responses:
        "200":
          description: The updated advice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Advice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
    delete:
      tags:
        - Advice
      summary: Delete a advice
      operationId: deleteAdvice
      responses:
        "204":
          description: Deleted, no content
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
