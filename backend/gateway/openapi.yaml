          description: Model that wrote the content (set by the service)
        source:
          type:
            - string
            - "null"
          enum:
            - llm
            - stub
            - user
            - null
          description: llm = model answer, stub = placeholder (no API key), user = content supplied by the caller
        created_at:
          type: string
          format: date-time
    AdviceInput:
      type: object
      additionalProperties: false
      required:
        - user_id
        - prompt
      properties:
        user_id:
          type: string
          maxLength: 50
          example: u1
        trip_id:
          type: integer
          minimum: 1
          description: Trip this advice is about (optional)
          example: 1
        topic:
          type: string
          enum:
            - general
            - packing
            - food
            - safety
            - budget
            - itinerary
          default: general
          example: packing
        prompt:
          type: string
          maxLength: 1000
          description: The question to ask the LLM
          example: What should I pack for Tokyo in December?
        content:
          type: string
          description: The answer. Leave out on create to have the LLM write it.
          example: "Pack layers: it is cold but dry. Bring a warm coat, comfortable shoes, and a Suica card."
    AdvicePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Any subset of the fields
      properties:
        user_id:
          type: string
          maxLength: 50
          example: u1
        trip_id:
          type: integer
          minimum: 1
          description: Trip this advice is about (optional)
          example: 1
        topic:
          type: string
          enum:
            - general
            - packing
            - food
            - safety
            - budget
            - itinerary
          default: general
          example: packing
        prompt:
          type: string
          maxLength: 1000
          description: The question to ask the LLM
          example: What should I pack for Tokyo in December?
        content:
          type: string
          description: The answer. Leave out on create to have the LLM write it.
          example: "Pack layers: it is cold but dry. Bring a warm coat, comfortable shoes, and a Suica card."
    RecommendationRequest:
      type: object
      required:
        - user_id
        - destination
        - budget
      additionalProperties: false
      properties:
        user_id:
          type: string
          example: u1
        trip_id:
          type: integer
          minimum: 1
          example: 1
        origin:
          type: string
          description: Origin airport code
          example: SEA
        destination:
          type: string
          example: Tokyo
        nights:
          type: integer
          minimum: 1
          example: 5
        travelers:
          type: integer
          minimum: 1
          default: 1
          example: 1
        budget:
          type: number
          minimum: 0
          example: 2500
        currency:
          type: string
          default: USD
          example: USD
        preferences:
          type: string
          example: food and museums
        include_car:
          type: boolean
          default: false
          description: Also pick the cheapest rental car in the destination city (charged per day for the whole trip)
          example: false
    Recommendation:
      type: object
      properties:
        id:
          type: integer
          example: 5
        summary:
          type: string
          example: Fly ANA NH 177 to Tokyo, stay at Hotel Gracery Shinjuku for 5 nights...
        selection:
          type: object
          properties:
            flight_id:
              type: integer
              example: 2
            hotel_id:
              type: integer
              example: 1
            activity_ids:
              type: array
              items:
                type: integer
              example:
                - 2
                - 3
                - 1
            car_rental_id:
              type:
                - integer
                - "null"
              example: null
        breakdown:
          type: object
          description: Computed in code by the LLM service, never by the model
          properties:
            flights:
              type: number
              example: 912
            hotel:
              type: number
              example: 825
            activities:
              type: number
              example: 97
            car_rental:
              type: number
              example: 0
        total:
          type: number
          example: 1834
        budget:
          type: number
          example: 2500
        within_budget:
          type: boolean
          example: true
        source:
          type: string
          enum:
            - llm
            - stub
          description: llm = the model chose the items, stub = chosen by plain rules
          example: stub
        model:
          type: string
          example: stub
        currency:
          type: string
          example: USD
        remaining:
          type: number
          example: 666
    SettlementReport:
      type: object
      properties:
        balances:
          type: array
          items:
            type: object
            properties:
              member:
                type: string
                example: Alice
              balance:
                type: number
                example: 156.67
        transfers:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
                example: You
              to:
                type: string
                example: Alice
              amount:
                type: number
                example: 53.34
  responses:
    ValidationError:
      description: The request has invalid parameters, an invalid body, or malformed JSON
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: BAD_REQUEST
              message: Request validation failed
              details:
                - endDate must be on or after startDate
    Unauthorized:
      description: The bearer token is missing, invalid, or expired, or its account was deleted
      headers:
        WWW-Authenticate:
          description: The authentication scheme to use
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: UNAUTHORIZED
              message: Token is invalid or expired
    TripNotFound:
      description: The trip does not exist or belongs to another user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Trip not found
    DayNotFound:
      description: The trip does not exist or belongs to another user (`Trip not found`), or the trip has no such day (`Day not found`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Day not found
    ItemNotFound:
      description: The trip, the day, or the item does not exist, or the trip belongs to another user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Itinerary item not found
    DaysInUse:
      description: The new dates would remove days that still have places. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CONFLICT
              message: The new dates would remove days that still have places
              details:
                - Day 5 has places; remove them first
    EmailConflict:
      description: The email already belongs to an account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CONFLICT
              message: Email is already registered
    ServerError:
      description: An unexpected server error occurred
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error
    BadRequest:
      description: The request is missing or has an invalid parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist, or no service owns the path (NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected error (INTERNAL_ERROR)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpstreamUnavailable:
      description: The owning service is down or refused the connection (UPSTREAM_UNAVAILABLE)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpstreamTimeout:
      description: The owning service did not answer in time (UPSTREAM_TIMEOUT)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: The language model failed (LLM_UNAVAILABLE)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Trip ID
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1
    DayNumber:
      name: dayNumber
      in: path
      required: true
      description: Day of the trip, starting at 1 for the start date
      schema:
        type: integer
        minimum: 1
      example: 1
    ItemId:
      name: itemId
      in: path
      required: true
      description: Itinerary item ID
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Health
  - name: Auth
    description: Create an account and obtain a token
  - name: Users
    description: Manage the signed-in user's own account
  - name: Trips
    description: Create, find, and manage the signed-in user's own trips
  - name: Itineraries
    description: Plan the places of each day of a trip
  - name: Places
    description: Browse the places that can be added to an itinerary
  - name: Flights
  - name: Hotels
  - name: Car rentals
  - name: Activities
  - name: Advice
  - name: Planned
    description: Designed for Phase III; not implemented yet
