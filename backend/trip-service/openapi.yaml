openapi: 3.0.3
info:
  title: Travel Planner API
  version: 1.0.0
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt
  description: |
    RESTful API for trips, the flights attached to them, and day-by-day
    itineraries in a travel planning app. Accounts and login live in the
    user service (GraphQL at /api/graphql); this service only checks the token.

    **Itineraries:** every trip has one itinerary day per date, created and
    kept in step with the trip's dates automatically. Each day holds an
    ordered list of places.

    **Authentication:** log in through the user service to receive a JWT and send it to the API gateway
    as `Authorization: Bearer <token>`. The gateway asks the user service to check the token, then calls
    this service with the user's id in `X-User-Id`. This service does not read tokens itself, so it must only
    be reachable through the gateway. To try it directly on this page, click **Authorize** and enter a user id.

    **Privacy:** an account can only reach its own data. The account comes from
    the token, so user IDs never appear in a URL, and another user's trip
    responds with `404`, the same as a trip that does not exist.
servers:
  - url: /api
    description: This server
tags:
  - name: Trips
    description: Create, find, and manage the signed-in user's own trips
  - name: Itineraries
    description: Plan the places of each day of a trip
  - name: Places
    description: Browse the places that can be added to an itinerary
paths:
  /trips:
    post:
      tags: [Trips]
      summary: Create a trip
      description: |
        The owner is always the signed-in user. An `ownerId` in the body is ignored.
        One empty itinerary day is created for every date of the trip, and a
        trip can last at most 90 days.
      operationId: createTrip
      security:
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripRequest'
            example:
              title: Rome Getaway
              destination: Rome
              startDate: '2027-09-01'
              endDate: '2027-09-05'
      responses:
        '201':
          description: Trip created
          headers:
            Location:
              description: URL of the new trip
              schema:
                type: string
              example: /api/trips/16
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              example:
                id: 16
                ownerId: 1
                title: Rome Getaway
                destination: Rome
                startDate: '2027-09-01'
                endDate: '2027-09-05'
                createdAt: '2026-11-06T18:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      tags: [Trips]
      summary: List my trips
      description: |
        Returns the signed-in user's trips, ordered by start date. `search` and
        `status` are optional and can be combined.
      operationId: listTrips
      security:
        - userIdHeader: []
      parameters:
        - name: search
          in: query
          description: Keep trips whose title contains this text, ignoring case. A blank value is ignored.
          schema:
            type: string
            maxLength: 120
          example: japan
        - name: status
          in: query
          description: >-
            `upcoming` keeps trips that have not ended yet, including trips in
            progress. `past` keeps trips that have ended. Dates are compared
            using the database server's current date.
          schema:
            type: string
            enum: [upcoming, past]
      responses:
        '200':
          description: The matching trips. The list is empty when nothing matches.
          headers:
            X-Total-Count:
              description: Number of trips returned
              schema:
                type: integer
              example: 2
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
              example:
                - id: 5
                  ownerId: 1
                  title: Japan Spring Getaway
                  destination: Osaka
                  startDate: '2026-04-02'
                  endDate: '2026-04-09'
                  createdAt: '2026-11-06T18:00:00.000Z'
                - id: 1
                  ownerId: 1
                  title: Japan Trip
                  destination: Tokyo
                  startDate: '2027-01-28'
                  endDate: '2027-02-03'
                  createdAt: '2026-11-06T18:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /trips/{tripId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Trips]
      summary: Get one of my trips
      operationId: getTrip
      security:
        - userIdHeader: []
      responses:
        '200':
          description: The requested trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              example:
                id: 1
                ownerId: 1
                title: Japan Trip
                destination: Tokyo
                startDate: '2027-01-28'
                endDate: '2027-02-03'
                createdAt: '2026-11-06T18:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Trips]
      summary: Update one of my trips
      description: |
        Replaces the trip's editable fields, so all of them are required.

        The itinerary days follow the new dates: every day is re-dated from the
        new start date, extra days are added when the trip gets longer, and
        trailing days are removed when it gets shorter. A day that still has
        places is never removed; the request fails with `409` instead, and
        nothing changes.
      operationId: updateTrip
      security:
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripRequest'
            example:
              title: Japan Winter Trip
              destination: Tokyo
              startDate: '2027-01-28'
              endDate: '2027-02-05'
      responses:
        '200':
          description: Trip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
              example:
                id: 1
                ownerId: 1
                title: Japan Winter Trip
                destination: Tokyo
                startDate: '2027-01-28'
                endDate: '2027-02-05'
                createdAt: '2026-11-06T18:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '409':
          $ref: '#/components/responses/DaysInUse'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Trips]
      summary: Delete one of my trips
      operationId: deleteTrip
      security:
        - userIdHeader: []
      responses:
        '204':
          description: Trip deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /trips/{tripId}/flights:
    parameters:
      - name: tripId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags:
        - Trips
      summary: List the flights attached to a trip
      operationId: listTripFlights
      responses:
        "200":
          description: The trip's flights, earliest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripFlight"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TripNotFound"
      security:
        - userIdHeader: []
    post:
      tags:
        - Trips
      summary: Attach a flight from the flight service
      description: The trip service reads the flight from the flight service and copies its details onto the trip.
      operationId: addTripFlight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - flightId
              properties:
                flightId:
                  type: integer
                  minimum: 1
            example:
              flightId: 1
      responses:
        "201":
          description: Flight attached
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripFlight"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TripNotFound"
        "409":
          description: The flight is already on this trip
        "502":
          description: The flight service is unavailable
      security:
        - userIdHeader: []
  /trips/{tripId}/flights/{tripFlightId}:
    delete:
      tags:
        - Trips
      summary: Remove a flight from a trip
      operationId: removeTripFlight
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: tripFlightId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/TripNotFound"
      security:
        - userIdHeader: []
  /trips/{tripId}/itineraries:
    parameters:
      - $ref: '#/components/parameters/TripId'
    get:
      tags: [Itineraries]
      summary: List the days of one of my trips
      operationId: listDays
      security:
        - userIdHeader: []
      responses:
        '200':
          description: Every day of the trip in order, with how many places each one has
          headers:
            X-Total-Count:
              description: Number of days returned
              schema:
                type: integer
              example: 7
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DaySummary'
              example:
                - id: 1
                  tripId: 1
                  dayNumber: 1
                  date: '2027-01-28'
                  placeCount: 2
                - id: 2
                  tripId: 1
                  dayNumber: 2
                  date: '2027-01-29'
                  placeCount: 3
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/TripNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /trips/{tripId}/itineraries/{dayNumber}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/DayNumber'
    get:
      tags: [Itineraries]
      summary: Get one day's itinerary
      operationId: getDay
      security:
        - userIdHeader: []
      responses:
        '200':
          description: The day with its places in visiting order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
              example:
                id: 1
                tripId: 1
                dayNumber: 1
                date: '2027-01-28'
                items:
                  - id: 1
                    position: 1
                    place:
                      id: 1
                      googlePlaceId: null
                      name: Senso-ji Temple
                      city: Tokyo
                      category: attraction
                  - id: 2
                    position: 2
                    place:
                      id: 2
                      googlePlaceId: null
                      name: Tokyo Skytree
                      city: Tokyo
                      category: attraction
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DayNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /trips/{tripId}/itineraries/{dayNumber}/items:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/DayNumber'
    post:
      tags: [Itineraries]
      summary: Add a place to a day
      description: |
        Inserts the place at `position`. The place already at that position,
        and every place after it, moves down by one. Leave out `position` to add
        the place at the end of the day. The same place may appear more than once.
      operationId: addItem
      security:
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItemRequest'
            example:
              placeId: 5
              position: 2
      responses:
        '201':
          description: Place added
          headers:
            Location:
              description: URL of the new itinerary item
              schema:
                type: string
              example: /api/trips/1/itineraries/1/items/15
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'
              example:
                id: 15
                position: 2
                place:
                  id: 5
                  googlePlaceId: null
                  name: Tsukiji Outer Market
                  city: Tokyo
                  category: food
        '400':
          description: >-
            The body is invalid, `placeId` does not match a place, or `position`
            is past the end of the day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Request validation failed
                  details:
                    - position must be between 1 and 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DayNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Itineraries]
      summary: Remove every place from a day
      description: Empties the day. The day itself remains, because the trip's dates define its days.
      operationId: clearItems
      security:
        - userIdHeader: []
      responses:
        '204':
          description: The day is now empty
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DayNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /trips/{tripId}/itineraries/{dayNumber}/items/order:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/DayNumber'
    put:
      tags: [Itineraries]
      summary: Reorder a day's places
      description: |
        `itemIds` lists every item of the day exactly once, in the new visiting
        order. The first ID gets position 1.
      operationId: reorderItems
      security:
        - userIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemOrderRequest'
            example:
              itemIds: [2, 1]
      responses:
        '200':
          description: The day in its new order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
              example:
                id: 1
                tripId: 1
                dayNumber: 1
                date: '2027-01-28'
                items:
                  - id: 2
                    position: 1
                    place:
                      id: 2
                      googlePlaceId: null
                      name: Tokyo Skytree
                      city: Tokyo
                      category: attraction
                  - id: 1
                    position: 2
                    place:
                      id: 1
                      googlePlaceId: null
                      name: Senso-ji Temple
                      city: Tokyo
                      category: attraction
        '400':
          description: The body is invalid, or `itemIds` does not list exactly the day's items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Request validation failed
                  details:
                    - itemIds must list every item of this day exactly once
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DayNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /trips/{tripId}/itineraries/{dayNumber}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/TripId'
      - $ref: '#/components/parameters/DayNumber'
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Itineraries]
      summary: Get one itinerary item
      operationId: getItem
      security:
        - userIdHeader: []
      responses:
        '200':
          description: The requested item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'
              example:
                id: 1
                position: 1
                place:
                  id: 1
                  googlePlaceId: null
                  name: Senso-ji Temple
                  city: Tokyo
                  category: attraction
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ItemNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Itineraries]
      summary: Remove a place from a day
      description: Every place after the removed one moves up by one, so positions stay 1, 2, 3, and so on.
      operationId: removeItem
      security:
        - userIdHeader: []
      responses:
        '204':
          description: Place removed
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ItemNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /places:
    get:
      tags: [Places]
      summary: List places
      description: |
        Returns the places that can be added to an itinerary, ordered by city and
        name. These are sample places stored in the database; `googlePlaceId` is
        reserved for a future Google Places integration.
      operationId: listPlaces
      security:
        - userIdHeader: []
      parameters:
        - name: city
          in: query
          description: Keep places in this city. The whole name must match, ignoring case.
          schema:
            type: string
            maxLength: 120
          example: tokyo
        - name: category
          in: query
          description: Keep places in this category. The whole name must match, ignoring case.
          schema:
            type: string
            maxLength: 120
          example: food
      responses:
        '200':
          description: The matching places. The list is empty when nothing matches.
          headers:
            X-Total-Count:
              description: Number of places returned
              schema:
                type: integer
              example: 1
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
              example:
                - id: 5
                  googlePlaceId: null
                  name: Tsukiji Outer Market
                  city: Tokyo
                  category: food
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /places/config:
    get:
      tags: [Places]
      summary: Whether Google Places is available
      description: The app shows the Google map in Add place when this is true, and the sample catalog otherwise.
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              example:
                googlePlaces: true
      security:
        - userIdHeader: []
  /places/nearby:
    get:
      tags: [Places]
      summary: Popular Google places around a point (the visible map area)
      description: |
        Proxies Google Places API (New) Nearby Search with the server's key, asking only for the fields the
        app shows. Answers are cached for 5 minutes per ~100 m area, so small map moves do not call Google again.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 }, example: 25.034 }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 }, example: 121.5645 }
        - { name: radius, in: query, description: Meters (default 1500), schema: { type: number, minimum: 100, maximum: 50000 } }
        - { name: category, in: query, schema: { type: string, enum: [attraction, food, museum, nature, shopping] } }
        - { name: language, in: query, description: 'Language of names, e.g. en, zh-TW (default en)', schema: { type: string } }
      responses:
        '200':
          description: Up to 20 places, most popular first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GooglePlace'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: Google Places failed or rejected the key
        '503':
          description: No GOOGLE_PLACES_API_KEY on the server, or the Google quota is used up
      security:
        - userIdHeader: []
  /places/locate:
    get:
      tags: [Places]
      summary: Where a destination is (to center the map)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, example: Tokyo }
        - { name: language, in: query, schema: { type: string } }
      responses:
        '200':
          description: Location and viewport
          content:
            application/json:
              example:
                name: Tokyo
                lat: 35.6764
                lng: 139.65
                viewport: { north: 35.8984, east: 139.9188, south: 35.5014, west: 139.5629 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Google found nothing for q
        '503':
          description: No GOOGLE_PLACES_API_KEY on the server
      security:
        - userIdHeader: []
components:
  securitySchemes:
    userIdHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: The signed-in user's id. The API gateway sets it after the user service accepts the token.
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Trip ID
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1
    DayNumber:
      name: dayNumber
      in: path
      required: true
      description: Day of the trip, starting at 1 for the start date
      schema:
        type: integer
        minimum: 1
      example: 1
    ItemId:
      name: itemId
      in: path
      required: true
      description: Itinerary item ID
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      example: 1
  schemas:
    GooglePlace:
      type: object
      description: A place from Google Places, as returned by /places/nearby.
      properties:
        googlePlaceId: { type: string, example: ChIJH56c2rarQjQRphD9gvC8BhI }
        name: { type: string, example: Taipei 101 }
        address: { type: string, nullable: true }
        lat: { type: number, example: 25.0339639 }
        lng: { type: number, example: 121.5644722 }
        category: { type: string, enum: [attraction, food, museum, nature, shopping] }
        type: { type: string, nullable: true, example: Tourist attraction }
        rating: { type: number, nullable: true, example: 4.6 }
        ratingCount: { type: integer, nullable: true, example: 98765 }
    TripFlight:
      type: object
      description: A flight attached to a trip (details copied from the flight service).
      properties:
        id:
          type: integer
          example: 1
        tripId:
          type: integer
          example: 1
        flightId:
          type: integer
          nullable: true
          example: 1
        airline:
          type: string
          example: Alaska Airlines
        flightNumber:
          type: string
          example: AS 21
        origin:
          type: string
          example: SEA
        destination:
          type: string
          example: HND
        departAt:
          type: string
          format: date-time
        arriveAt:
          type: string
          format: date-time
        price:
          type: number
          example: 845.5
        currency:
          type: string
          example: USD
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
          description: Stored in lowercase
        password:
          type: string
          format: password
          minLength: 8
          description: At least 8 characters and at most 72 bytes
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ProfileRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
    TripRequest:
      type: object
      required: [title, destination, startDate, endDate]
      properties:
        title:
          type: string
          maxLength: 120
        destination:
          type: string
          maxLength: 120
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Must be on or after startDate
    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT that expires after 1 hour
    Trip:
      type: object
      required: [id, ownerId, title, destination, startDate, endDate, createdAt]
      properties:
        id:
          type: integer
        ownerId:
          type: integer
        title:
          type: string
        destination:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    Place:
      type: object
      required: [id, googlePlaceId, name, city, category]
      properties:
        id:
          type: integer
        googlePlaceId:
          type: string
          nullable: true
          description: Reserved for a future Google Places integration; currently null
        name:
          type: string
        city:
          type: string
        category:
          type: string
          example: attraction
    ItineraryItem:
      type: object
      required: [id, position, place]
      properties:
        id:
          type: integer
        position:
          type: integer
          description: Visiting order within the day, starting at 1
        place:
          $ref: '#/components/schemas/Place'
    DaySummary:
      type: object
      required: [id, tripId, dayNumber, date, placeCount]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        dayNumber:
          type: integer
        date:
          type: string
          format: date
        placeCount:
          type: integer
          description: Number of places planned for the day
    Day:
      type: object
      required: [id, tripId, dayNumber, date, items]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        dayNumber:
          type: integer
        date:
          type: string
          format: date
        items:
          type: array
          description: The day's places in visiting order
          items:
            $ref: '#/components/schemas/ItineraryItem'
    NewItemRequest:
      type: object
      description: Send either placeId (sample catalog) or googlePlaceId (Google Places), not both.
      properties:
        placeId:
          type: integer
          minimum: 1
          description: ID from `GET /places` (the sample catalog)
        googlePlaceId:
          type: string
          description: |
            A place ID from `GET /places/nearby`. The service reads the place from Google and saves its
            name, address and location. 503 when the server has no Google key.
        language:
          type: string
          description: Language of the saved name, e.g. en or zh-TW (default en)
        position:
          type: integer
          minimum: 1
          description: Where to insert the place, from 1 to the number of places plus 1. Defaults to the end.
    ItemOrderRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          description: Every item ID of the day, once each, in the new order
          items:
            type: integer
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                Machine-readable error code, shared with the other services and the
                gateway: BAD_REQUEST (400), UNAUTHORIZED (401), NOT_FOUND (404),
                CONFLICT (409), or INTERNAL_ERROR (500).
              example: NOT_FOUND
            message:
              type: string
            details:
              type: array
              description: One entry per problem. Present only on validation errors.
              items:
                type: string
  responses:
    ValidationError:
      description: The request has invalid parameters, an invalid body, or malformed JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Request validation failed
              details:
                - endDate must be on or after startDate
    Unauthorized:
      description: The bearer token is missing, invalid, or expired, or its account was deleted
      headers:
        WWW-Authenticate:
          description: The authentication scheme to use
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Token is invalid or expired
    TripNotFound:
      description: The trip does not exist or belongs to another user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Trip not found
    DayNotFound:
      description: >-
        The trip does not exist or belongs to another user (`Trip not found`),
        or the trip has no such day (`Day not found`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Day not found
    ItemNotFound:
      description: The trip, the day, or the item does not exist, or the trip belongs to another user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Itinerary item not found
    DaysInUse:
      description: The new dates would remove days that still have places. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: The new dates would remove days that still have places
              details:
                - Day 5 has places; remove them first
    EmailConflict:
      description: The email already belongs to an account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: Email is already registered
    ServerError:
      description: An unexpected server error occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Internal server error
