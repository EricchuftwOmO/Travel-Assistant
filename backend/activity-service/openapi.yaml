openapi: 3.1.0
info:
  title: Travel Assistant - Activity Service
  version: 1.0.0
  description: 'Things to do at a destination. Cached in Redis for GET requests. Errors use { "error": { "code",
    "message", "details" } }.'
servers:
  - url: http://localhost:3007
    description: activity-service (published on localhost for development; other clients go through the gateway on
      port 8080)
tags:
  - name: Activities
  - name: Health
paths:
  /health:
    get:
      tags:
        - Health
      summary: Service and database health check
      operationId: getActivityServiceHealth
      responses:
        "200":
          description: Service and database are up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: activity-service
                  cache:
                    type: string
                    enum:
                      - redis
                      - off
        "503":
          description: Database unavailable
  /api/activities:
    get:
      tags:
        - Activities
      summary: List activitys
      operationId: listActivitys
      description: "All filters are optional and can be combined. Responses are cached in Redis (see the X-Cache
        header: HIT or MISS)."
      parameters:
        - name: city
          in: query
          description: City name (equals (ignore case))
          schema:
            type: string
        - name: category
          in: query
          description: Activity category (equals)
          schema:
            type: string
            enum:
              - sightseeing
              - food
              - outdoors
              - museum
              - nightlife
              - shopping
        - name: maxPrice
          in: query
          description: Highest price per person (<=)
          schema:
            type: number
        - name: q
          in: query
          description: Part of the name (case-insensitive) (contains)
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - id
              - name
              - price
              - rating
              - duration_minutes
            default: id
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Rows to skip
      responses:
        "200":
          description: A page of activitys
          headers:
            X-Total-Count:
              description: Rows matching the filters
              schema:
                type: integer
            X-Cache:
              description: HIT if served from Redis
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                  - total
                  - data
                properties:
                  count:
                    type: integer
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags:
        - Activities
      summary: Create a activity
      operationId: createActivity
      description: Send every required field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
          headers:
            Location:
              description: URL of the new record
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/activities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Activity ID
    get:
      tags:
        - Activities
      summary: Get one activity
      operationId: getActivity
      responses:
        "200":
          description: The activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Activities
      summary: Replace a activity
      operationId: replaceActivity
      description: Send every required field. Optional fields left out go back to their default (or null).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "200":
          description: The updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Activities
      summary: Update some fields of a activity
      operationId: updateActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityPatch"
      responses:
        "200":
          description: The updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Activities
      summary: Delete a activity
      operationId: deleteActivity
      responses:
        "204":
          description: Deleted, no content
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    Activity:
      type: object
      required:
        - id
        - name
        - city
        - category
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Senso-ji Temple
        city:
          type: string
          example: Tokyo
        category:
          type: string
          enum:
            - sightseeing
            - food
            - outdoors
            - museum
            - nightlife
            - shopping
          example: sightseeing
        description:
          type:
            - string
            - "null"
          example: Tokyo's oldest temple, with a lively market street leading to it.
        price:
          type:
            - number
            - "null"
          minimum: 0
          default: 0
          description: Cost per person (0 = free)
          example: 0
        currency:
          type:
            - string
            - "null"
          maxLength: 3
          default: USD
          example: USD
        duration_minutes:
          type:
            - integer
            - "null"
          minimum: 1
          example: 90
        rating:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 5
          example: 4.7
        created_at:
          type: string
          format: date-time
    ActivityInput:
      type: object
      additionalProperties: false
      required:
        - name
        - city
        - category
      properties:
        name:
          type: string
          example: Senso-ji Temple
        city:
          type: string
          example: Tokyo
        category:
          type: string
          enum:
            - sightseeing
            - food
            - outdoors
            - museum
            - nightlife
            - shopping
          example: sightseeing
        description:
          type: string
          example: Tokyo's oldest temple, with a lively market street leading to it.
        price:
          type: number
          minimum: 0
          default: 0
          description: Cost per person (0 = free)
          example: 0
        currency:
          type: string
          maxLength: 3
          default: USD
          example: USD
        duration_minutes:
          type: integer
          minimum: 1
          example: 90
        rating:
          type: number
          minimum: 0
          maximum: 5
          example: 4.7
    ActivityPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Any subset of the fields
      properties:
        name:
          type: string
          example: Senso-ji Temple
        city:
          type: string
          example: Tokyo
        category:
          type: string
          enum:
            - sightseeing
            - food
            - outdoors
            - museum
            - nightlife
            - shopping
          example: sightseeing
        description:
          type: string
          example: Tokyo's oldest temple, with a lively market street leading to it.
        price:
          type: number
          minimum: 0
          default: 0
          description: Cost per person (0 = free)
          example: 0
        currency:
          type: string
          maxLength: 3
          default: USD
          example: USD
        duration_minutes:
          type: integer
          minimum: 1
          example: 90
        rating:
          type: number
          minimum: 0
          maximum: 5
          example: 4.7
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
            details: {}
  responses:
    BadRequest:
      description: Invalid or missing field or query parameter (BAD_REQUEST). "details" lists every invalid field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: BAD_REQUEST
              message: Validation failed
              details:
                - field: name
                  message: is required
    NotFound:
      description: Activity not found (NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: The language model failed (LLM_UNAVAILABLE)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
