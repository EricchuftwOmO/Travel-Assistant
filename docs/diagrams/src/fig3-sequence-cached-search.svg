<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560"><rect width="100%" height="100%" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect x="10" y="14" width="160" height="46" rx="10" fill="#e3edff" stroke="#2b5cb8" stroke-width="2"/><text x="90.0" y="41.5" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a3366" text-anchor="middle">Client</text><line x1="90" y1="60" x2="90" y2="546" stroke="#9aa7c4" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="225" y="14" width="160" height="46" rx="10" fill="#e3edff" stroke="#2b5cb8" stroke-width="2"/><text x="305.0" y="41.5" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a3366" text-anchor="middle">API Gateway</text><line x1="305" y1="60" x2="305" y2="546" stroke="#9aa7c4" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="440" y="14" width="160" height="46" rx="10" fill="#e3edff" stroke="#2b5cb8" stroke-width="2"/><text x="520.0" y="41.5" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a3366" text-anchor="middle">Flight Service</text><line x1="520" y1="60" x2="520" y2="546" stroke="#9aa7c4" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="655" y="14" width="160" height="46" rx="10" fill="#e3edff" stroke="#2b5cb8" stroke-width="2"/><text x="735.0" y="32.0" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a3366" text-anchor="middle">Redis</text><text x="735.0" y="51.0" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle">cache</text><line x1="735" y1="60" x2="735" y2="546" stroke="#9aa7c4" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="870" y="14" width="160" height="46" rx="10" fill="#e3edff" stroke="#2b5cb8" stroke-width="2"/><text x="950.0" y="32.0" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a3366" text-anchor="middle">PostgreSQL</text><text x="950.0" y="51.0" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="normal" fill="#333" text-anchor="middle">flight_db</text><line x1="950" y1="60" x2="950" y2="546" stroke="#9aa7c4" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="90" y1="88" x2="305" y2="88" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="197.5" y="78" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">1. GET /api/flights?origin=SEA</text><line x1="305" y1="138" x2="520" y2="138" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="412.5" y="128" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">2. forward + X-Request-Id</text><line x1="520" y1="188" x2="735" y2="188" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="627.5" y="178" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">3. look up cached response</text><line x1="735" y1="238" x2="520" y2="238" stroke="#333" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="627.5" y="228" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">4. miss (or Redis down)</text><line x1="520" y1="288" x2="950" y2="288" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="735.0" y="278" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">5. SELECT ... WHERE origin = SEA</text><line x1="950" y1="338" x2="520" y2="338" stroke="#333" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="735.0" y="328" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6. rows</text><line x1="520" y1="388" x2="735" y2="388" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="627.5" y="378" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">7. store for 60 s</text><line x1="520" y1="438" x2="305" y2="438" stroke="#333" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="412.5" y="428" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">8. 200 + X-Cache: MISS</text><line x1="305" y1="488" x2="90" y2="488" stroke="#333" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="197.5" y="478" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="normal" fill="#222" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">9. 200 + JSON list</text></svg>